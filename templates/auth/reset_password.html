<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Set New Password — TalkToText Pro</title>

  <!-- Google Fonts: Fraunces, Inter, IBM Plex Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

  <style>
    :root {
      --ink: #12151C;
      --surface: #191E27;
      --surface-2: #1F2530;
      --surface-3: #252C39;
      --line: #2A3140;
      --paper: #ECE9E2;
      --paper-dim: #9CA3AF;
      --signal: #E8A33D;
      --signal-dim: rgba(232, 163, 61, 0.2);
      --coral: #E85A3D;
      --serif: 'Fraunces', serif;
      --sans: 'Inter', sans-serif;
      --mono: 'IBM Plex Mono', monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--ink); color: var(--paper); font-family: var(--sans); line-height: 1.5;
      min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px;
    }
    a { color: inherit; text-decoration: none; }
    .card {
      background: var(--surface); border: 1px solid var(--line); border-radius: 20px;
      padding: 36px 32px; width: 100%; max-width: 420px; box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
    }
    .btn {
      font-family: var(--sans); font-size: 14px; font-weight: 600; border-radius: 9px; border: 1px solid transparent;
      display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 11px 18px; cursor: pointer;
      width: 100%; transition: all .2s ease;
    }
    .btn-primary { background: var(--signal); color: #1A1305; box-shadow: 0 6px 16px -8px rgba(232, 163, 61, 0.55); }
    .btn-primary:hover { background: #F0B25A; transform: translateY(-1px); }
    input {
      width: 100%; padding: 11px 14px; border-radius: 9px; background: var(--surface-2); border: 1px solid var(--line);
      color: var(--paper); font-size: 13.5px; outline: none; transition: border-color .2s ease;
    }
    input:focus { border-color: var(--signal); }
  </style>
</head>
<body>

<div class="card">
  <!-- Brand Header -->
  <div style="text-align: center; margin-bottom: 28px;">
    <a href="{{ url_for('home') }}" style="display: inline-flex; align-items: center; gap: 10px; margin-bottom: 12px;">
      <svg style="width: 32px; height: 32px;" viewBox="0 0 30 30" fill="none">
        <rect x="0.5" y="0.5" width="29" height="29" rx="8" fill="#1F2530" stroke="#2A3140"/>
        <path d="M9 16.5V13.5" stroke="#E8A33D" stroke-width="1.6" stroke-linecap="round"/>
        <path d="M13 19V11" stroke="#E8A33D" stroke-width="1.6" stroke-linecap="round"/>
        <path d="M17 21V9" stroke="#ECE9E2" stroke-width="1.6" stroke-linecap="round"/>
        <path d="M21 16.5V13.5" stroke="#ECE9E2" stroke-width="1.6" stroke-linecap="round"/>
      </svg>
      <span style="font-family: var(--serif); font-size: 20px; font-weight: 600;">TalkToText Pro</span>
    </a>
    <h2 style="font-family: var(--serif); font-size: 22px; font-weight: 500; color: var(--paper); margin-bottom: 4px;">Set New Password</h2>
    <p style="font-size: 13px; color: var(--paper-dim);">Choose a secure password for your account</p>
  </div>

  <!-- Flash Messages -->
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
      <div style="margin-bottom: 20px; display: flex; flex-direction: column; gap: 8px;">
        {% for category, message in messages %}
          <div style="padding: 10px 14px; border-radius: 8px; font-size: 13px; background: var(--surface-2); border: 1px solid {% if category == 'error' %}var(--coral){% else %}var(--signal){% endif %}; color: var(--paper);">
            {{ message }}
          </div>
        {% endfor %}
      </div>
    {% endif %}
  {% endwith %}

  <!-- Reset Form -->
  <form method="POST" action="{{ url_for('reset_password') }}" style="display: flex; flex-direction: column; gap: 16px;">
    <input type="hidden" name="email" value="{{ target_email }}">
    <input type="hidden" name="token" value="{{ token }}">
    
    <div>
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
        <label style="font-family: var(--mono); font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--paper-dim);">New Password</label>
        <span id="resetStrengthBadge" style="font-size: 11px; font-family: var(--mono); font-weight: 600; color: var(--paper-dim);">Enter password</span>
      </div>
      <div style="position: relative; display: flex; align-items: center;">
        <input type="password" id="resetPassInput" name="password" required minlength="6" placeholder="••••••••" style="width: 100%; padding-right: 40px;" oninput="validateResetLivePassword()">
        <button type="button" onclick="toggleResetPass('resetPassInput', 'resetEye1')" style="position: absolute; right: 12px; background: none; border: none; color: var(--paper-dim); cursor: pointer; display: flex; align-items: center;">
          <span id="resetEye1" style="font-size: 14px;">👁️</span>
        </button>
      </div>
      
      <!-- 4-Stage Strength Bar -->
      <div style="display: flex; gap: 4px; margin-top: 8px;">
        <div id="rbar1" style="height: 3.5px; flex: 1; border-radius: 4px; background: rgba(255,255,255,0.1); transition: all 0.3s ease;"></div>
        <div id="rbar2" style="height: 3.5px; flex: 1; border-radius: 4px; background: rgba(255,255,255,0.1); transition: all 0.3s ease;"></div>
        <div id="rbar3" style="height: 3.5px; flex: 1; border-radius: 4px; background: rgba(255,255,255,0.1); transition: all 0.3s ease;"></div>
        <div id="rbar4" style="height: 3.5px; flex: 1; border-radius: 4px; background: rgba(255,255,255,0.1); transition: all 0.3s ease;"></div>
      </div>
    </div>

    <div>
      <label style="display: block; font-family: var(--mono); font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--paper-dim); margin-bottom: 6px;">Confirm Password</label>
      <div style="position: relative; display: flex; align-items: center;">
        <input type="password" id="resetConfirmInput" name="confirm_password" required minlength="6" placeholder="••••••••" style="width: 100%; padding-right: 40px;" oninput="validateResetMatch()">
        <button type="button" onclick="toggleResetPass('resetConfirmInput', 'resetEye2')" style="position: absolute; right: 12px; background: none; border: none; color: var(--paper-dim); cursor: pointer; display: flex; align-items: center;">
          <span id="resetEye2" style="font-size: 14px;">👁️</span>
        </button>
      </div>
      <div id="resetMatchMsg" style="font-size: 11px; margin-top: 5px; display: none;"></div>
    </div>

    <button type="submit" class="btn btn-primary" style="margin-top: 6px;">
      <span>Save Password in Database</span>
    </button>
  </form>
</div>

<script>
  function validateResetLivePassword() {
    const val = document.getElementById('resetPassInput').value;
    let score = 0;
    if (val.length >= 6) score++;
    if (val.length >= 8) score++;
    if (/[A-Z]/.test(val)) score++;
    if (/[0-9]/.test(val)) score++;
    if (/[!@#$%^&*(),.?":{}|<>]/.test(val)) score++;

    const b1 = document.getElementById('rbar1');
    const b2 = document.getElementById('rbar2');
    const b3 = document.getElementById('rbar3');
    const b4 = document.getElementById('rbar4');
    const badge = document.getElementById('resetStrengthBadge');

    b1.style.background = 'rgba(255,255,255,0.1)';
    b2.style.background = 'rgba(255,255,255,0.1)';
    b3.style.background = 'rgba(255,255,255,0.1)';
    b4.style.background = 'rgba(255,255,255,0.1)';

    if (val.length === 0) {
      badge.textContent = 'Enter password';
      badge.style.color = 'var(--paper-dim)';
    } else if (score <= 2) {
      b1.style.background = '#EF4444';
      badge.textContent = 'Weak';
      badge.style.color = '#EF4444';
    } else if (score === 3) {
      b1.style.background = '#F59E0B';
      b2.style.background = '#F59E0B';
      badge.textContent = 'Fair';
      badge.style.color = '#F59E0B';
    } else if (score === 4) {
      b1.style.background = '#06B6D4';
      b2.style.background = '#06B6D4';
      b3.style.background = '#06B6D4';
      badge.textContent = 'Good';
      badge.style.color = '#06B6D4';
    } else {
      b1.style.background = '#10B981';
      b2.style.background = '#10B981';
      b3.style.background = '#10B981';
      b4.style.background = '#10B981';
      badge.textContent = 'Strong';
      badge.style.color = '#10B981';
    }

    validateResetMatch();
  }

  function validateResetMatch() {
    const p1 = document.getElementById('resetPassInput').value;
    const p2 = document.getElementById('resetConfirmInput').value;
    const msg = document.getElementById('resetMatchMsg');

    if (!p2) {
      msg.style.display = 'none';
      return;
    }

    msg.style.display = 'block';
    if (p1 === p2) {
      msg.textContent = '✔ Passwords match';
      msg.style.color = '#10B981';
    } else {
      msg.textContent = '✖ Passwords do not match';
      msg.style.color = '#EF4444';
    }
  }

  function toggleResetPass(inputId, iconId) {
    const input = document.getElementById(inputId);
    const icon = document.getElementById(iconId);
    if (input.type === 'password') {
      input.type = 'text';
      icon.textContent = '🙈';
    } else {
      input.type = 'password';
      icon.textContent = '👁️';
    }
  }
</script>

</body>
</html>
